<html lang="en">

  "url": "https://thakurjisweets.com",

    "postalCode": "208001",
    "addressCountry": "IN"
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6ECD9;
    --cream-soft:#FBF6EA;
    --maroon:#5A1327;
    --maroon-deep:#2C0A15;
    --gold:#BE9A4E;
    --gold-light:#E4CA84;
    --green:#243F2C;
    --krishna-blue:#233B6E;
    --saffron:#C2701E;
    --saffron-light:#E7A854;
    --ink:#2A1810;
    --ink-soft:#5c4636;
    --max:1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    font-weight:400;
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    color:var(--maroon);
    line-height:1.1;
  }
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%; height:auto;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  .eyebrow{
    font-family:'Manrope', sans-serif;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--gold);
  }

  /* ---------- Signature divider: trishul-flame rule ---------- */
  .divider{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:8px 0;
  }
  .divider .line{ height:1px; width:80px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .divider svg{ width:22px; height:26px; flex-shrink:0; }

  /* ---------- Corner-frame device for images (echoes gift-box gold corners) ---------- */
  .frame{
    position:relative;
    padding:10px;
    background:var(--cream-soft);
    border:1px solid rgba(190,154,78,.5);
  }
  .frame::before, .frame::after{
    content:'';
    position:absolute;
    width:22px; height:22px;
    border:2px solid var(--gold);
  }
  .frame::before{ top:-6px; left:-6px; border-right:none; border-bottom:none; }
  .frame::after{ bottom:-6px; right:-6px; border-left:none; border-top:none; }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- Nav ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    transition: background .4s ease, box-shadow .4s ease;
  }
  header.scrolled{
    background:rgba(246,236,217,.94);
    backdrop-filter:blur(6px);
    box-shadow:0 4px 20px rgba(44,10,21,.08);
  }
  .announce-bar{
    background:linear-gradient(90deg, var(--maroon-deep), var(--krishna-blue) 50%, var(--maroon-deep));
    color:var(--gold-light);
    text-align:center;
    font-size:12.5px;
    letter-spacing:.02em;
    padding:9px 16px;
    max-height:50px;
    overflow:hidden;
    transition:max-height .3s ease, padding .3s ease, opacity .3s ease;
  }
  .announce-bar a{ color:var(--gold-light); text-decoration:underline; font-weight:700; margin-left:4px; white-space:nowrap; }
  header.scrolled .announce-bar{ max-height:0; padding:0; opacity:0; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; padding-top:16px; padding-bottom:16px; transition:padding .4s ease; }
  header.scrolled nav.wrap{ padding-top:10px; padding-bottom:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:34px; height:34px; }
  .brand-word{ font-family:'Cormorant Garamond', serif; font-size:20px; letter-spacing:.06em; color:var(--cream-soft); font-weight:700; transition:color .4s ease;}
  header.scrolled .brand-word{ color:var(--maroon); }
  .nav-links{ display:flex; gap:30px; align-items:center; }
  .nav-links a{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    color:var(--cream-soft); opacity:.9; transition:color .4s ease, opacity .2s;
  }
  header.scrolled .nav-links a{ color:var(--ink); }
  .nav-links a:hover{ opacity:1; color:var(--gold-light); }
  header.scrolled .nav-links a:hover{ color:var(--maroon); }
  .nav-badge{ position:relative; }
  .nav-badge::after{ content:''; position:absolute; top:-3px; right:-9px; width:6px; height:6px; border-radius:50%; background:var(--gold); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; padding:14px 28px; border:1px solid var(--gold);
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
    color:var(--gold-light); transition:all .25s ease; min-height:44px;
  }
  .btn:hover{ background:var(--gold); color:var(--maroon-deep); }
  header.scrolled .btn{ color:var(--maroon); border-color:var(--maroon); }
  header.scrolled .btn:hover{ background:var(--maroon); color:var(--cream-soft); }
  .btn-solid{ background:var(--gold); color:var(--maroon-deep); border-color:var(--gold);}
  .btn-solid:hover{ background:var(--gold-light); border-color:var(--gold-light); color:var(--maroon-deep);}
  .nav-toggle{ display:none; background:none; border:none; color:var(--cream-soft); font-size:26px; cursor:pointer; min-width:44px; min-height:44px; }
  header.scrolled .nav-toggle{ color:var(--maroon); }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; min-height:100svh; display:flex; align-items:flex-end;
    background:#000;
  }
  .hero-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:60% 40%;
    opacity:.78;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(44,10,21,.55) 0%, rgba(44,10,21,.35) 32%, rgba(30,7,15,.92) 100%);
  }
  .hero-content{
    position:relative; z-index:2; width:100%;
    padding:206px 0 90px;
    text-align:center;
  }
  .hero-crest{ width:64px; height:64px; margin:0 auto 22px; }
  .hero-content .eyebrow{ color:var(--gold-light); }
  .hero h1{
    color:var(--cream-soft);
    font-size:clamp(46px, 8vw, 92px);
    letter-spacing:.02em;
    margin:10px 0 18px;
  }
  .hero-tagline{
    color:var(--gold-light);
    font-size:14px; letter-spacing:.18em; text-transform:uppercase; font-weight:600;
    margin-bottom:26px;
  }
  .hero-sub{
    max-width:560px; margin:0 auto 40px;
    color:rgba(246,236,217,.85);
    font-size:17px;
  }
  .hero-ctas{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
  .scroll-cue{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:2; color:var(--gold-light); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .scroll-cue .stem{ width:1px; height:34px; background:linear-gradient(180deg, var(--gold), transparent); animation:stemPulse 2.2s ease-in-out infinite; }
  @keyframes stemPulse{ 0%,100%{opacity:.3} 50%{opacity:1} }

  /* ---------- Section basics ---------- */
  section{ padding:110px 0; position:relative; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 60px; }
  .section-head h2{ font-size:clamp(34px,4.6vw,52px); margin:14px 0 16px; }
  .section-head p{ color:var(--ink-soft); font-size:16.5px; }

  /* ---------- Story ---------- */
  .story{ background:var(--cream-soft); }
  .story-grid{ display:grid; grid-template-columns:1fr 1fr; gap:70px; align-items:center; }
  .story-text .eyebrow{ margin-bottom:16px; display:block; }
  .story-text h2{ font-size:clamp(32px,4.2vw,46px); margin-bottom:22px; }
  .story-text p{ color:var(--ink-soft); margin-bottom:18px; font-size:16.5px; }
  .story-text p:last-of-type{ margin-bottom:0; }
  .story-quote{
    margin-top:30px; padding-left:22px; border-left:2px solid var(--gold);
    font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--maroon);
    font-size:21px;
  }
  .story-img .frame{ aspect-ratio:4/5; }

  /* ---------- Sweets grid ---------- */
  .sweets{ background:var(--cream); }
  .sweet-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:34px 28px;
  }
  .sweet-card{ text-align:left; }
  .sweet-card .frame{ aspect-ratio:1/1; margin-bottom:18px; }
  .sweet-card h3{ font-size:24px; margin-bottom:6px; }
  .sweet-card .tag{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px; display:block;
  }
  .sweet-card p{ font-size:14.5px; color:var(--ink-soft); }
  .sweet-price{
    display:inline-block; margin-top:10px; font-family:'Cormorant Garamond',serif; font-weight:700;
    color:var(--maroon); font-size:17px; letter-spacing:.02em;
  }
  .card-order{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px;
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--maroon); transition:gap .2s ease, color .2s ease;
  }
  .card-order:hover{ color:var(--gold); gap:10px; }
  .card-order span{ font-size:14px; }

  /* ---------- Floating WhatsApp order button ---------- */
  .fab-whatsapp{
    position:fixed; bottom:22px; right:22px; z-index:150;
    width:58px; height:58px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.3);
    transition:transform .2s ease;
  }
  .fab-whatsapp:hover{ transform:scale(1.08); }
  .fab-whatsapp svg{ width:27px; height:27px; }

  /* ---------- Ganesh Chaturthi Special ---------- */
  .ganesh{
    background:linear-gradient(180deg, var(--cream), var(--cream-soft));
    position:relative; overflow:hidden;
  }
  .ganesh::before{
    content:''; position:absolute; top:-150px; left:-120px; width:360px; height:360px;
    border-radius:50%; background:radial-gradient(circle, rgba(194,112,30,.10), transparent 70%);
  }
  .ganesh::after{
    content:''; position:absolute; bottom:-150px; right:-120px; width:340px; height:340px;
    border-radius:50%; background:radial-gradient(circle, rgba(190,154,78,.14), transparent 70%);
  }
  .gc-particle{
    position:absolute; border-radius:50%; background:var(--saffron-light);
    opacity:.35; pointer-events:none; animation:gcFloat 7s ease-in-out infinite;
  }
  .gc-particle:nth-child(1){ width:8px; height:8px; top:14%; left:8%; animation-delay:0s; }
  .gc-particle:nth-child(2){ width:5px; height:5px; top:30%; right:12%; animation-delay:1.6s; background:var(--gold); }
  .gc-particle:nth-child(3){ width:6px; height:6px; bottom:20%; left:16%; animation-delay:3s; }
  @keyframes gcFloat{ 0%,100%{ transform:translateY(0); opacity:.25; } 50%{ transform:translateY(-14px); opacity:.55; } }
  .gc-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--saffron); color:var(--cream-soft);
    padding:8px 18px; border-radius:999px;
    font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
    margin-bottom:18px;
  }
  .gc-badge svg{ width:16px; height:16px; flex-shrink:0; }
  .gc-tagline{
    font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--maroon);
    font-size:20px; margin-bottom:14px;
  }
  .gc-location-line{
    display:inline-flex; align-items:center; gap:7px;
    color:var(--ink-soft); font-size:14px; font-weight:600; margin-top:8px;
  }
  .gc-location-line svg{ width:15px; height:15px; color:var(--saffron); flex-shrink:0; }
  .gc-ctas{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:30px; }

  .gc-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:30px;
    position:relative; z-index:1; margin-top:10px;
  }
  .gc-card{
    background:var(--cream-soft); border:1px solid rgba(190,154,78,.4);
    padding:18px 18px 24px; position:relative; text-align:left;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .gc-card:hover{ transform:translateY(-4px); box-shadow:0 14px 30px rgba(44,10,21,.10); }
  .gc-card::before{
    content:''; position:absolute; top:-1px; left:-1px; right:-1px; height:3px;
    background:linear-gradient(90deg, var(--saffron), var(--gold));
  }
  .gc-card .frame{ aspect-ratio:1/1; margin-bottom:16px; overflow:hidden; }
  .gc-card .frame img{ transition:transform .5s ease; }
  .gc-card:hover .frame img{ transform:scale(1.06); }
  .gc-card .tag{ color:var(--saffron); }

  .ph-tile{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg, var(--cream-soft), #f1e3c8);
    color:var(--ink-soft); font-size:12px; letter-spacing:.04em; text-align:center; padding:14px;
  }
  .ph-tile svg{ width:32px; height:32px; opacity:.5; }

  .gc-location-strip{
    margin-top:56px; padding:34px 32px; background:var(--maroon-deep); color:var(--cream-soft);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px;
    position:relative; z-index:1;
  }
  .gc-location-strip .tag{ color:var(--saffron-light); }
  .gc-location-strip h3{ color:var(--cream-soft); font-size:26px; margin:6px 0 8px; }
  .gc-location-strip p{ color:rgba(246,236,217,.8); font-size:15px; max-width:440px; }

  .gc-cta{ text-align:center; margin-top:64px; position:relative; z-index:1; }
  .gc-cta h3{ font-size:clamp(26px,3.2vw,34px); margin-bottom:10px; }
  .gc-cta p{ color:var(--ink-soft); margin-bottom:22px; font-size:15.5px; }

  .btn-shimmer{ position:relative; overflow:hidden; }
  .btn-shimmer::after{
    content:''; position:absolute; top:0; left:-60%; width:50%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
    transform:skewX(-20deg); transition:left .6s ease;
  }
  .btn-shimmer:hover::after{ left:120%; }

  /* ---------- Gifting (dark) ---------- */
  .gifting{
    background:linear-gradient(180deg, var(--maroon-deep), var(--maroon));
    color:var(--cream-soft);
  }
  .gifting .section-head p{ color:rgba(246,236,217,.78); }
  .gifting .section-head h2{ color:var(--cream-soft); }
  .gifting .eyebrow{ color:var(--gold-light); }
  .gift-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:60px; align-items:center; margin-bottom:90px; }
  .gift-grid.reverse{ grid-template-columns:1fr 1.1fr; }
  .gift-grid.reverse .gift-img{ order:2; }
  .gift-grid.reverse .gift-text{ order:1; }
  .gift-grid:last-child{ margin-bottom:0; }
  .gift-img .frame{ aspect-ratio:5/4; background:rgba(246,236,217,.06); border-color:rgba(190,154,78,.55); }
  .gift-text h3{ color:var(--cream-soft); font-size:clamp(26px,3.4vw,36px); margin-bottom:16px; }
  .gift-text p{ color:rgba(246,236,217,.8); font-size:16px; margin-bottom:22px; }

  /* ---------- Visit ---------- */
  .visit{ background:var(--cream-soft); }
  .visit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:70px; align-items:center; }
  .visit-img .frame{ aspect-ratio:4/3; }
  .visit-text .eyebrow{ display:block; margin-bottom:16px; }
  .visit-text h2{ font-size:clamp(32px,4.2vw,46px); margin-bottom:28px; }
  .info-row{ display:flex; gap:18px; margin-bottom:24px; align-items:flex-start; }
  .info-row svg{ flex-shrink:0; width:22px; height:22px; margin-top:3px; color:var(--gold); }
  .info-row h4{ font-family:'Manrope'; font-size:14px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--maroon); margin-bottom:4px;}
  .info-row p{ color:var(--ink-soft); font-size:15.5px; }
  .info-row p a{ color:var(--maroon); font-weight:700; }
  .info-row p a:hover{ color:var(--gold); }
  .visit-ctas{ display:flex; gap:16px; margin-top:32px; flex-wrap:wrap; }
  .btn-dark{ border-color:var(--maroon); color:var(--maroon); }
  .btn-dark:hover{ background:var(--maroon); color:var(--cream-soft); }

  /* ---------- Social banner ---------- */
  .social{
    background:var(--cream);
    text-align:center;
  }
  .social-frame{
    max-width:340px; margin:0 auto 34px;
  }
  .social-frame .frame{ aspect-ratio:1/1; }
  .social h2{ font-size:clamp(30px,4vw,44px); margin-bottom:14px; }
  .social p{ color:var(--ink-soft); max-width:480px; margin:0 auto 30px; }

  /* ---------- Footer ---------- */
  footer{ background:var(--maroon-deep); color:rgba(246,236,217,.75); padding:70px 0 30px; }
  .foot-grid{ display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:40px; margin-bottom:50px; }
  .foot-brand{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .foot-brand span{ font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--cream-soft); font-weight:700; letter-spacing:.04em;}
  .foot-brand img{ width:34px; height:34px; }
  footer p{ font-size:14.5px; line-height:1.8; }
  footer h4{ color:var(--gold-light); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; margin-bottom:18px; }
  .foot-links a{ display:block; font-size:14.5px; margin-bottom:12px; color:rgba(246,236,217,.75); transition:color .2s; }
  .foot-links a:hover{ color:var(--gold-light); }
  .foot-bottom{
    border-top:1px solid rgba(190,154,78,.25); padding-top:26px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    font-size:13px; color:rgba(246,236,217,.55);
  }
  .foot-bottom a{ color:var(--gold-light); }

  /* ---------- Reveal animation ---------- */
  .reveal{ opacity:.4; transform:translateY(26px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .reveal{ opacity:1; transform:none; transition:none; }
    .scroll-cue .stem{ animation:none; }
    .gc-particle{ animation:none; opacity:.2; }
    .gc-card{ transition:none; }
    .gc-card:hover{ transform:none; }
    .gc-card:hover .frame img{ transform:none; }
    .btn-shimmer::after{ display:none; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width:980px){
    .sweet-grid{ grid-template-columns:repeat(2, 1fr); }
    .story-grid, .visit-grid{ grid-template-columns:1fr; gap:40px; }
    .story-img{ order:-1; }
    .gift-grid, .gift-grid.reverse{ grid-template-columns:1fr; }
    .gift-grid.reverse .gift-img, .gift-grid.reverse .gift-text{ order:0; }
    .foot-grid{ grid-template-columns:1fr 1fr; }
    .foot-grid > div:first-child{ grid-column:1 / -1; }
    .gc-grid{ grid-template-columns:repeat(2, 1fr); }
    .gc-location-strip{ text-align:center; justify-content:center; }
  }
  @media (max-width:720px){
    .nav-links{
      position:fixed; top:0; right:0; height:100vh; width:min(78vw, 320px);
      background:var(--maroon-deep); flex-direction:column; justify-content:center; gap:30px;
      transform:translateX(100%); transition
